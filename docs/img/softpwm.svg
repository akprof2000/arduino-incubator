<text x="70.0" y="284.0" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Обычный analogWrite на такой нагрузке даёт гудение и не создаёт тяги на малых значениях.</text>
