<text x="10.0" y="210.0" font-size="11" fill="#57606a" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">val=100</text>
<text x="10.0" y="226.0" font-size="10" fill="#57606a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">39 %</text>
