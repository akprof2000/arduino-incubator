<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Диаграмма медленного ШИМ">
<style>text{fill:#57606a}</style>
<text x="14.0" y="24.0" font-size="15" fill="#57606a" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">«Медленный» ШИМ вентилятора и испарителя (период задаётся PEEKVALUE)</text>
<text x="10.0" y="62.0" font-size="11" fill="#57606a" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">val=200</text>
